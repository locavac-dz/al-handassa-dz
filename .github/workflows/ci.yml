name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Tests d'intégration du backend sur un PostgreSQL vierge : valide aussi que schema.sql + migrations 020→… s'appliquent
  # depuis zéro et sont ré-applicables (idempotentes), comme le fait le preDeployCommand de Railway.
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]          # 20 = version de l'image Docker de production
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: handassi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/handassi_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/handassi_test
      DB_SSL: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # pg_dump / pg_restore : requis par tests/backup.test.js (en CI leur absence est une erreur, pas un « ignoré »)
      - name: Client PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Migrations depuis zéro
        run: npm run migrate
      - name: Migrations ré-appliquées (idempotence)
        run: npm run migrate
      - name: Tests
        run: npm test

  # Construit l'image de production (Dockerfile jamais exécuté avant ce job) et vérifie qu'elle contient ce qu'il faut.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fichiers de déploiement valides
        run: |
          node -e "JSON.parse(require('fs').readFileSync('railway.json','utf8')); console.log('railway.json : JSON valide')"
      - name: Construction de l'image
        run: docker build -t al-handassa:ci .
      - name: PyMuPDF disponible (aperçus PDF)
        run: docker run --rm --entrypoint python3 al-handassa:ci -c "import pymupdf; print('PyMuPDF', pymupdf.VersionBind)"
      - name: L'application se charge avec les seules dépendances de production
        run: >
          docker run --rm -e NODE_ENV=test -e DATABASE_URL=postgres://x:x@127.0.0.1:1/x
          -e JWT_SECRET=ci-only-secret-0123456789abcdef0123456789
          --entrypoint node al-handassa:ci -e "require('/app/backend/src/app.js'); console.log('app.js chargé'); process.exit(0)"
      - name: Fonctionne sans root et avec un dossier uploads inscriptible
        run: docker run --rm --entrypoint sh al-handassa:ci -c 'test "$(id -u)" != 0 && touch backend/uploads/.w && echo OK'

  # deploy/nginx/*.conf n'a jamais tourné (pas de nginx sur le poste de développement) : validé ici avec un vrai nginx
  # (le même install que deploy/setup.sh) et de faux certificats, comme le ferait `nginx -t` sur le VPS après déploiement.
  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installation de nginx
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx
      - name: Installation des fichiers (comme l'indique l'en-tête de handassi.dz.conf)
        run: |
          sudo cp deploy/nginx/security-headers.conf /etc/nginx/snippets/handassi-security-headers.conf
          sudo cp deploy/nginx/proxy.conf            /etc/nginx/snippets/handassi-proxy.conf
          sudo cp deploy/nginx/handassi.dz.conf       /etc/nginx/sites-available/handassi.dz
          sudo ln -s /etc/nginx/sites-available/handassi.dz /etc/nginx/sites-enabled/handassi.dz
          sudo rm -f /etc/nginx/sites-enabled/default   # comme en production : un seul site actif
      - name: Faux certificat (nginx -t exige que les fichiers ssl_certificate existent et soient valides)
        run: |
          sudo mkdir -p /etc/letsencrypt/live/handassi.dz
          sudo openssl req -x509 -nodes -days 1 -newkey rsa:2048 -subj "/CN=handassi.dz" \
            -keyout /etc/letsencrypt/live/handassi.dz/privkey.pem \
            -out    /etc/letsencrypt/live/handassi.dz/fullchain.pem
          sudo cp /etc/letsencrypt/live/handassi.dz/fullchain.pem /etc/letsencrypt/live/handassi.dz/chain.pem
      - name: nginx -t
        run: sudo nginx -t
      - name: Garde-fou — /uploads/ ne doit jamais être servi par un « alias » (contournerait le paywall)
        run: |
          ! grep -qE '^\s*alias\s' deploy/nginx/handassi.dz.conf   # directive « alias », pas le mot dans un commentaire
          grep -A2 'location \^~ /uploads/' deploy/nginx/handassi.dz.conf | grep -q 'proxy_pass http://127.0.0.1:5000'
