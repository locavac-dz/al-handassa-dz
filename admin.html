<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Al Handassa.dz</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/admin.css"/>
  <meta name="robots" content="noindex,nofollow"/>
</head>
<body>

<!-- ═══ GUARD ═══ -->
<div id="guard" class="guard-screen">
  <div class="guard-box">
    <div class="guard-logo">⚙ Al Handassa<span>.dz</span></div>
    <h2>Accès Administration</h2>
    <div id="guard-msg" class="guard-msg"></div>
    <button id="guard-btn" onclick="adminApp.login()">
      <i class="fas fa-lock"></i> Vérification en cours…
    </button>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app" style="display:none">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span>⚙</span>
      <div>
        <div class="sidebar-brand">Al Handassa<span>.dz</span></div>
        <div class="sidebar-sub">Administration</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-page="dashboard"><i class="fas fa-chart-line"></i> Tableau de bord</button>

      <div class="nav-section-label">Transactions</div>
      <button class="nav-item" data-page="payments"><i class="fas fa-credit-card"></i> Paiements <span class="nav-badge" id="badge-payments">0</span></button>
      <button class="nav-item" data-page="orders"><i class="fas fa-shopping-bag"></i> Commandes</button>
      <button class="nav-item" data-page="users"><i class="fas fa-users"></i> Utilisateurs</button>

      <div class="nav-section-label">Contenu</div>
      <button class="nav-item" data-page="products"><i class="fas fa-box"></i> Produits & Ressources</button>
      <button class="nav-item" data-page="videos"><i class="fas fa-play-circle"></i> Vidéos</button>
      <button class="nav-item" data-page="articles"><i class="fas fa-newspaper"></i> Articles</button>
      <button class="nav-item" data-page="levels"><i class="fas fa-graduation-cap"></i> Niveaux d'études</button>
    </nav>
    <div class="sidebar-footer">
      <a href="index.html" target="_blank" class="sidebar-link"><i class="fas fa-external-link-alt"></i> Voir le site</a>
      <button class="sidebar-logout" onclick="adminApp.logout()"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main-content">
    <div class="topbar">
      <div class="topbar-title" id="page-title">Tableau de bord</div>
      <div class="topbar-admin" id="topbar-user"></div>
    </div>
    <div class="page-body" id="page-body">
      <!-- Chargé dynamiquement -->
    </div>
  </main>

</div>

<!-- ═══ MODAL ═══ -->
<div id="modal-overlay" class="modal-overlay" style="display:none" onclick="adminApp.closeModal()">
  <div class="modal-box" onclick="e=>e.stopPropagation()">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button onclick="adminApp.closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<div id="toast" class="adm-toast"></div>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
