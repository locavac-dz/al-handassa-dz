<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Al Handassa.dz</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/img/favicon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #0f2744 0%, #1B3A6B 50%, #0f2744 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-wrap {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }
    .auth-header {
      background: linear-gradient(135deg, #1B3A6B, #2563a8);
      padding: 28px 32px 20px;
      text-align: center;
      color: #fff;
    }
    .auth-logo { width: 140px; margin-bottom: 10px; }
    .auth-header h1 { font-size: 18px; font-weight: 700; opacity: .9; }
    .auth-tabs {
      display: flex;
      border-bottom: 2px solid #e8ecf0;
    }
    .auth-tab {
      flex: 1;
      padding: 14px;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      font-weight: 600;
      border: none;
      background: none;
      cursor: pointer;
      color: #888;
      transition: color .2s, border-bottom .2s;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }
    .auth-tab.active { color: #1B3A6B; border-bottom-color: #1B3A6B; }
    .auth-body { padding: 28px 32px 32px; }
    .panel { display: none; }
    .panel.active { display: block; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .form-input, .form-select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Cairo', sans-serif;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
      background: #fff;
    }
    .form-input:focus, .form-select:focus { border-color: #1B3A6B; box-shadow: 0 0 0 3px rgba(27,58,107,.1); }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-family: 'Cairo', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg, #1B3A6B, #2563a8); color: #fff; }
    .btn-secondary { background: linear-gradient(135deg, #D4A017, #e8b929); color: #1B3A6B; }
    .msg {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    .msg.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .msg.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .msg.show { display: block; }
    .link-row { text-align: center; margin-top: 14px; font-size: 13px; color: #888; }
    .link-row a { color: #1B3A6B; text-decoration: none; font-weight: 600; }
    .link-row a:hover { text-decoration: underline; }
    .back-home { display: block; text-align: center; margin-top: 18px; font-size: 12px; color: #aaa; text-decoration: none; }
    .back-home:hover { color: #1B3A6B; }
    .divider { display: flex; align-items: center; gap: 10px; margin: 16px 0; color: #9ca3af; font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; }
  </style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-header">
    <img src="img/logo-full.png" alt="Al Handassa.dz" class="auth-logo" onerror="this.style.display='none'" />
    <h1>Bienvenue sur Al Handassa.dz</h1>
  </div>

  <div class="auth-tabs">
    <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Connexion</button>
    <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Inscription</button>
  </div>

  <div class="auth-body">

    <!-- CONNEXION -->
    <div class="panel active" id="panel-login">
      <form id="login-form" onsubmit="doLogin(event)">
        <div class="form-group">
          <label class="form-label">Email *</label>
          <input type="email" id="l-email" class="form-input" placeholder="exemple@email.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label">Mot de passe *</label>
          <input type="password" id="l-password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" id="btn-login">🚀 Se Connecter</button>
        <div id="login-msg" class="msg"></div>
        <div class="link-row"><a href="#" onclick="switchTab('register');return false">Pas encore de compte ? S'inscrire</a></div>
      </form>
    </div>

    <!-- INSCRIPTION -->
    <div class="panel" id="panel-register">
      <form id="register-form" onsubmit="doRegister(event)">
        <div class="row-2">
          <div class="form-group">
            <label class="form-label">Prénom *</label>
            <input type="text" id="r-fname" class="form-input" placeholder="Ahmed" required autocomplete="given-name" />
          </div>
          <div class="form-group">
            <label class="form-label">Nom *</label>
            <input type="text" id="r-lname" class="form-input" placeholder="Benali" required autocomplete="family-name" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Email *</label>
          <input type="email" id="r-email" class="form-input" placeholder="ahmed@email.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label">Téléphone (Algérie)</label>
          <input type="tel" id="r-phone" class="form-input" placeholder="07X XXX XX XX" autocomplete="tel" />
        </div>
        <div class="form-group">
          <label class="form-label">Niveau d'études</label>
          <select id="r-level" class="form-select">
            <option value="">— Votre niveau —</option>
            <option value="bac_technique">Bac Technique (Génie Civil / Architecture)</option>
            <option value="bts">BTS Génie Civil</option>
            <option value="licence">Licence Génie Civil</option>
            <option value="licence">Licence Architecture</option>
            <option value="master">Master Génie Civil</option>
            <option value="master">Master Architecture</option>
            <option value="ingenieur">École d'Ingénieurs</option>
            <option value="professionnel">Professionnel</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Mot de passe * (min. 8 caractères)</label>
          <input type="password" id="r-password" class="form-input" placeholder="••••••••" required autocomplete="new-password" minlength="8" />
        </div>
        <button type="submit" class="btn btn-secondary" id="btn-register">✅ Créer mon Compte Gratuit</button>
        <div id="register-msg" class="msg"></div>
        <div class="link-row"><a href="#" onclick="switchTab('login');return false">Déjà un compte ? Se connecter</a></div>
      </form>
    </div>

    <a href="index.html" class="back-home">← Retour à l'accueil</a>
  </div>
</div>

<script>
const API = 'http://localhost:5000/api';

function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('panel-login').classList.toggle('active', tab === 'login');
  document.getElementById('panel-register').classList.toggle('active', tab === 'register');
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + type + ' show';
}

// Redirect si déjà connecté
(function() {
  const token = localStorage.getItem('hds_token');
  if (!token) return;
  fetch(API + '/auth/me', { headers: { Authorization: 'Bearer ' + token } })
    .then(r => r.json())
    .then(d => {
      if (d.user) {
        const redir = new URLSearchParams(location.search).get('redirect') || 'index.html';
        location.href = redir;
      }
    }).catch(() => {});
})();

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-login');
  const email = document.getElementById('l-email').value.trim();
  const password = document.getElementById('l-password').value;
  btn.disabled = true; btn.textContent = '⏳ Connexion...';
  try {
    const res = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Identifiants incorrects');
    localStorage.setItem('hds_token', data.token);
    if (data.user) localStorage.setItem('hds_user', JSON.stringify(data.user));
    showMsg('login-msg', '🎉 Connexion réussie ! Redirection...', 'success');
    setTimeout(() => {
      const redir = new URLSearchParams(location.search).get('redirect') || 'index.html';
      location.href = redir;
    }, 800);
  } catch (err) {
    showMsg('login-msg', '❌ ' + err.message, 'error');
    btn.disabled = false; btn.textContent = '🚀 Se Connecter';
  }
}

async function doRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-register');
  const first_name = document.getElementById('r-fname').value.trim();
  const last_name  = document.getElementById('r-lname').value.trim();
  const email      = document.getElementById('r-email').value.trim();
  const phone      = document.getElementById('r-phone').value.trim();
  const password   = document.getElementById('r-password').value;
  const study_level = document.getElementById('r-level').value || null;

  if (!first_name || !last_name || !email || !password) {
    showMsg('register-msg', '⚠️ Remplissez tous les champs obligatoires.', 'error'); return;
  }
  if (password.length < 8) {
    showMsg('register-msg', '⚠️ Mot de passe : minimum 8 caractères.', 'error'); return;
  }

  btn.disabled = true; btn.textContent = '⏳ Création...';
  try {
    const body = { first_name, last_name, email, password };
    if (phone) body.phone = phone;
    if (study_level) body.study_level = study_level;

    const res = await fetch(API + '/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur lors de la création du compte');
    localStorage.setItem('hds_token', data.token);
    if (data.user) localStorage.setItem('hds_user', JSON.stringify(data.user));
    showMsg('register-msg', '🎉 Compte créé avec succès ! Redirection...', 'success');
    setTimeout(() => { location.href = 'index.html'; }, 1000);
  } catch (err) {
    showMsg('register-msg', '❌ ' + err.message, 'error');
    btn.disabled = false; btn.textContent = '✅ Créer mon Compte Gratuit';
  }
}

// Support ?tab=register dans l'URL
if (new URLSearchParams(location.search).get('tab') === 'register') {
  switchTab('register');
}
</script>
</body>
</html>
