# ══════════════════════════════════════════════════════════════════
#  Nginx — handassi.dz
#  Reverse proxy Node.js :5000  +  pages statiques du front
#  Installation :
#    cp deploy/nginx/security-headers.conf /etc/nginx/snippets/handassi-security-headers.conf
#    cp deploy/nginx/proxy.conf            /etc/nginx/snippets/handassi-proxy.conf
#    cp deploy/nginx/handassi.dz.conf      /etc/nginx/sites-available/handassi.dz
#    ln -s /etc/nginx/sites-available/handassi.dz /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#  Ce fichier est chargé dans le contexte http{} : les directives limit_req_zone ci-dessous y sont valides.
#  Côté Node : TRUST_PROXY=1 (l'IP client est lue dans X-Forwarded-For posé par nginx).
# ══════════════════════════════════════════════════════════════════

# Limitation de débit (première ligne de défense ; l'application a ses propres limiteurs)
limit_req_zone $binary_remote_addr zone=hds_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=hds_auth:10m rate=5r/s;

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name handassi.dz www.handassi.dz;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://handassi.dz$request_uri; }
}

# Redirect www → non-www (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.handassi.dz;

    ssl_certificate     /etc/letsencrypt/live/handassi.dz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/handassi.dz/privkey.pem;

    return 301 https://handassi.dz$request_uri;
}

# ─── Serveur principal ────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name handassi.dz;

    # SSL (Let's Encrypt via Certbot)
    ssl_certificate     /etc/letsencrypt/live/handassi.dz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/handassi.dz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/handassi.dz/chain.pem;

    # Protocoles et ciphers recommandés (Mozilla Modern)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ─── En-têtes de sécurité ─────────────────────────────────────
    # nginx n'hérite des add_header du parent QUE si le bloc location n'en définit aucun : le snippet est donc
    # inclus ici ET dans chaque location qui pose son propre add_header (sinon les en-têtes disparaissaient
    # pour les assets et le HTML).
    include snippets/handassi-security-headers.conf;

    # ─── Compression Gzip ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml image/svg+xml font/woff2;

    # ─── Taille max upload (doit correspondre à MAX_FILE_SIZE_MB) ──
    client_max_body_size 210M;

    # ─── Racine frontend statique ─────────────────────────────────
    root /var/www/handassi.dz/public;
    index index.html;

    # ─── Jamais servi : fichiers cachés, sources, journaux, dumps, manifestes de paquets ──
    # (regex placée avant les autres : la première qui correspond l'emporte)
    location ~ /\. { return 404; }
    location ~* \.(md|py|sh|bat|ps1|sql|log|env|bak|swp|yml|yaml|lock)$ { return 404; }
    location ~* ^/(package(-lock)?\.json|Dockerfile|ecosystem\.config\.js|backend/|deploy/|node_modules/) { return 404; }

    # ─── Sitemap et santé : générés par l'application (à jour, jamais le fichier statique) ──
    location = /sitemap.xml { proxy_pass http://127.0.0.1:5000; include snippets/handassi-proxy.conf; }
    location = /health      { proxy_pass http://127.0.0.1:5000; include snippets/handassi-proxy.conf; }

    # ─── Assets statiques (JS/CSS/images/polices) : cache d'un an ─
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/handassi-security-headers.conf;
        access_log off;
    }

    # ─── HTML : cache court, revalidation ─────────────────────────
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        include snippets/handassi-security-headers.conf;
    }

    # ─── Authentification : débit plus strict ─────────────────────
    location ^~ /api/auth/ {
        limit_req zone=hds_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:5000;
        include snippets/handassi-proxy.conf;
    }

    # ─── API → Node.js :5000 ─────────────────────────────────────
    # ^~ : sans lui, une regex d'extension (.jpg, .js…) l'emporterait sur ce préfixe et l'URL ne serait pas proxifiée
    location ^~ /api/ {
        limit_req zone=hds_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:5000;
        include snippets/handassi-proxy.conf;
    }

    # ─── Fichiers uploadés → Node.js (JAMAIS servis directement par nginx) ─
    # L'application décide de ce qui est public (images, aperçus) ; les PDF/vidéos/fichiers payants ne sortent que
    # par /api/products/:id/download et /api/videos/stream/:token. Un « alias » ici contournait ce contrôle et
    # rendait tous les fichiers payants téléchargeables sans achat.
    location ^~ /uploads/ {
        limit_req zone=hds_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:5000;
        include snippets/handassi-proxy.conf;
        proxy_buffering on;
    }

    # ─── Pages du site (les URL sans extension → .html) ───────────
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ─── Pages d'erreur personnalisées ────────────────────────────
    error_page 404 /404.html;
    error_page 500 502 503 504 /404.html;

    # ─── Logs ─────────────────────────────────────────────────────
    access_log /var/log/nginx/handassi.access.log;
    error_log  /var/log/nginx/handassi.error.log warn;
}
