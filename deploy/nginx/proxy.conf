# Paramètres communs des proxy_pass vers Node.js — à copier dans /etc/nginx/snippets/handassi-proxy.conf
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Node (TRUST_PROXY=1) lit l'IP client à l'extrémité droite de X-Forwarded-For, celle qu'ajoute nginx : non falsifiable
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;
proxy_connect_timeout 10s;
# En-têtes que nginx pose déjà (snippets/handassi-security-headers.conf) : évite les doublons contradictoires
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
