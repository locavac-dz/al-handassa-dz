<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Revenus - Al Handassa</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #1B3A6B 0%, #2d5a8c 100%);
            color: white;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.9;
        }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .metric-card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #1B3A6B;
        }
        .metric-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .metric-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #1B3A6B;
            margin-bottom: 5px;
        }
        .metric-change {
            font-size: 0.9em;
            color: #27ae60;
        }
        .metric-change.negative {
            color: #e74c3c;
        }
        .charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .chart-title {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th {
            background: #1B3A6B;
            color: white;
            padding: 15px;
            text-align: left;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        tr:hover {
            background: #f9f9f9;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .status-completed {
            background: #d4edda;
            color: #155724;
        }
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }
        .refresh-btn {
            background: #1B3A6B;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            float: right;
            margin-bottom: 20px;
        }
        .refresh-btn:hover {
            background: #152d52;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Tableau de Bord Revenus</h1>
            <p>Suivi temps réel des ventes et revenus</p>
        </div>

        <button class="refresh-btn" onclick="refreshDashboard()">🔄 Actualiser</button>

        <div class="metrics" id="metricsContainer">
            <div class="metric-card">
                <div class="metric-label">Revenus Totaux</div>
                <div class="metric-value" id="totalRevenue">0 DA</div>
                <div class="metric-change" id="revenueChange">↑ 0%</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Commandes</div>
                <div class="metric-value" id="totalOrders">0</div>
                <div class="metric-change" id="ordersChange">↑ 0%</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Utilisateurs</div>
                <div class="metric-value" id="totalUsers">0</div>
                <div class="metric-change" id="usersChange">↑ 0%</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Taux de Conversion</div>
                <div class="metric-value" id="conversionRate">0%</div>
                <div class="metric-change">↑ 0%</div>
            </div>
        </div>

        <div class="charts">
            <div class="chart-container">
                <div class="chart-title">Revenus Mensuels</div>
                <canvas id="revenueChart"></canvas>
            </div>
            <div class="chart-container">
                <div class="chart-title">Croissance des Utilisateurs</div>
                <canvas id="usersChart"></canvas>
            </div>
        </div>

        <h2 style="margin: 30px 0 20px; color: #333;">Dernières Commandes</h2>
        <table>
            <thead>
                <tr>
                    <th>ID Commande</th>
                    <th>Client</th>
                    <th>Montant</th>
                    <th>Statut</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="ordersTable">
                <tr>
                    <td colspan="5" class="loading">Chargement...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        let revenueChartInstance = null;
        let usersChartInstance = null;

        async function loadDashboardData() {
            try {
                const response = await fetch('/api/analytics/dashboard', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                const data = await response.json();

                // Update metrics
                document.getElementById('totalRevenue').textContent =
                    `${data.totalRevenue.toLocaleString()} DA`;
                document.getElementById('totalOrders').textContent = data.totalOrders;
                document.getElementById('totalUsers').textContent = data.totalUsers;
                document.getElementById('conversionRate').textContent =
                    `${(data.conversionRate * 100).toFixed(1)}%`;

                document.getElementById('revenueChange').textContent =
                    `${data.revenueChange >= 0 ? '↑' : '↓'} ${Math.abs(data.revenueChange).toFixed(1)}%`;
                document.getElementById('ordersChange').textContent =
                    `${data.ordersChange >= 0 ? '↑' : '↓'} ${Math.abs(data.ordersChange).toFixed(1)}%`;
                document.getElementById('usersChange').textContent =
                    `${data.usersChange >= 0 ? '↑' : '↓'} ${Math.abs(data.usersChange).toFixed(1)}%`;

                // Update charts
                updateRevenueChart(data.monthlyRevenue);
                updateUsersChart(data.userGrowth);

                // Update orders table
                updateOrdersTable(data.recentOrders);

            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        function updateRevenueChart(data) {
            const ctx = document.getElementById('revenueChart');
            if (revenueChartInstance) {
                revenueChartInstance.destroy();
            }

            revenueChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.month),
                    datasets: [{
                        label: 'Revenus',
                        data: data.map(d => d.amount),
                        borderColor: '#1B3A6B',
                        backgroundColor: 'rgba(27, 58, 107, 0.1)',
                        tension: 0.4,
                        fill: true,
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return value.toLocaleString() + ' DA';
                                }
                            }
                        }
                    }
                }
            });
        }

        function updateUsersChart(data) {
            const ctx = document.getElementById('usersChart');
            if (usersChartInstance) {
                usersChartInstance.destroy();
            }

            usersChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.month),
                    datasets: [{
                        label: 'Nouv. Utilisateurs',
                        data: data.map(d => d.users),
                        backgroundColor: '#27ae60'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function updateOrdersTable(orders) {
            const tbody = document.getElementById('ordersTable');
            tbody.innerHTML = orders.map(order => `
                <tr>
                    <td>#${order.id}</td>
                    <td>${order.customer_name}</td>
                    <td>${order.total_amount.toLocaleString()} DA</td>
                    <td><span class="status-badge status-${order.status}">${order.status}</span></td>
                    <td>${new Date(order.created_at).toLocaleDateString('fr-FR')}</td>
                </tr>
            `).join('');
        }

        function refreshDashboard() {
            console.log('Refreshing dashboard...');
            loadDashboardData();
        }

        // Load on page load and refresh every 30 seconds
        loadDashboardData();
        setInterval(loadDashboardData, 30000);
    </script>
</body>
</html>
