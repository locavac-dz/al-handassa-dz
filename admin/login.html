<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<style>
  body { font-family: Arial, sans-serif; background: #1B3A6B; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .box { background: white; padding: 40px; border-radius: 16px; width: 340px; text-align: center; }
  h2 { color: #1B3A6B; margin-bottom: 24px; }
  input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
  button { width: 100%; padding: 13px; background: #1B3A6B; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
  button:hover { background: #15305a; }
  #msg { color: red; font-size: 0.85rem; margin-top: 10px; min-height: 20px; }
</style>
</head>
<body>
<div class="box">
  <h2>⚙ Al Handassa.dz<br><small style="font-size:0.7rem;color:#64748b">Administration</small></h2>
  <input type="email"    id="email" value="admin@handassi.dz" placeholder="Email"/>
  <input type="password" id="pass"  placeholder="Mot de passe" onkeydown="if(event.key==='Enter')login()"/>
  <button onclick="login()">🔐 Se connecter</button>
  <div id="msg"></div>
</div>
<script>
async function login() {
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('pass').value;
  const msg   = document.getElementById('msg');
  msg.textContent = 'Connexion...';
  try {
    const r = await fetch('http://localhost:5000/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password: pass})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Erreur');
    if (d.user.role !== 'admin') throw new Error('Pas un compte admin');
    localStorage.setItem('hds_token',   d.access_token);
    localStorage.setItem('hds_refresh', d.refresh_token);
    localStorage.setItem('hds_user',    JSON.stringify(d.user));
    msg.style.color = 'green';
    msg.textContent = '✅ Connecté ! Redirection...';
    setTimeout(() => { window.location.href = '/admin/'; }, 800);
  } catch(e) {
    msg.style.color = 'red';
    msg.textContent = '❌ ' + e.message;
  }
}
// Si déjà connecté, aller direct à l'admin
const t = localStorage.getItem('hds_token');
if (t) window.location.href = '/admin/';
</script>
</body>
</html>
