<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — Al Handassa.dz</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#1B3A6B;min-height:100vh;display:flex;align-items:center;justify-content:center}

/* ── LOGIN ── */
#login-screen{width:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:white;border-radius:20px;padding:40px 36px;width:380px;box-shadow:0 24px 80px rgba(0,0,0,0.3)}
.login-logo{font-size:1.6rem;font-weight:900;color:#1B3A6B;text-align:center;margin-bottom:6px}
.login-logo span{color:#C8A142}
.login-sub{text-align:center;color:#64748b;font-size:0.82rem;margin-bottom:28px;text-transform:uppercase;letter-spacing:1px}
.login-input{width:100%;padding:12px 16px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:0.95rem;color:#1e293b;outline:none;margin-bottom:12px;transition:border-color .2s}
.login-input:focus{border-color:#1B3A6B}
.login-btn{width:100%;padding:13px;background:#1B3A6B;color:white;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;transition:background .2s;margin-top:4px}
.login-btn:hover{background:#15305a}
.login-btn:disabled{opacity:.6;cursor:not-allowed}
.login-msg{text-align:center;font-size:0.85rem;margin-top:12px;min-height:20px;color:#dc2626}
.login-msg.ok{color:#16a34a}

/* ── APP ── */
#app-screen{display:none;width:100vw;height:100vh;flex-direction:row}
.sidebar{width:240px;background:#1B3A6B;color:white;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:20px;border-bottom:1px solid rgba(255,255,255,.1);font-size:1.3rem}
.sidebar-brand{font-size:.95rem;font-weight:800}
.sidebar-brand span{color:#C8A142}
.sidebar-sub{font-size:.6rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1px}
.nav-section{font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.3);padding:12px 16px 4px;margin-top:4px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 16px;border-radius:10px;background:none;border:none;color:rgba(255,255,255,.7);font-size:.87rem;font-weight:600;cursor:pointer;transition:all .2s;text-align:left;margin:2px 8px;width:calc(100% - 16px)}
.nav-btn:hover,.nav-btn.active{background:rgba(255,255,255,.15);color:white}
.nav-btn i{width:18px;text-align:center}
.nav-badge{margin-left:auto;background:#dc2626;color:white;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:20px}
.sidebar-bottom{padding:12px;border-top:1px solid rgba(255,255,255,.1);margin-top:auto}
.sidebar-link{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;font-size:.82rem;font-weight:600;color:rgba(255,255,255,.6);background:none;border:none;cursor:pointer;text-decoration:none;width:100%;transition:all .2s}
.sidebar-link:hover{background:rgba(255,255,255,.1);color:white}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#f0f4fa}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:white;border-bottom:1px solid #e2e8f0;flex-shrink:0}
.topbar-title{font-size:1.05rem;font-weight:800;color:#1B3A6B}
.topbar-user{font-size:.82rem;color:#64748b}
.page{flex:1;overflow-y:auto;padding:24px 28px}

/* ── KPI ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(27,58,107,.07);border-left:4px solid #1B3A6B}
.kpi.g{border-color:#16a34a}.kpi.o{border-color:#ea580c}.kpi.r{border-color:#dc2626}
.kpi-val{font-size:1.7rem;font-weight:900;color:#1e293b;line-height:1}
.kpi-lbl{font-size:.72rem;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}

/* ── TABLE ── */
.card{background:white;border-radius:12px;box-shadow:0 2px 8px rgba(27,58,107,.07);margin-bottom:16px;overflow:hidden}
.card-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #e2e8f0}
.card-hdr h3{font-size:.92rem;font-weight:800;color:#1B3A6B}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;padding:10px 16px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#64748b;background:#f8fafc;border-bottom:1px solid #e2e8f0}
td{padding:11px 16px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}
.no-data{text-align:center;color:#94a3b8;padding:40px!important}

/* ── BADGE ── */
.bdg{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700}
.bdg-pending{background:#fef3c7;color:#92400e}.bdg-paid,.bdg-completed,.bdg-active{background:#dcfce7;color:#15803d}
.bdg-failed,.bdg-rejected{background:#fee2e2;color:#991b1b}.bdg-processing{background:#dbeafe;color:#1d4ed8}
.bdg-admin{background:#fee2e2;color:#991b1b}.bdg-student{background:#dbeafe;color:#1d4ed8}
.bdg-free{background:#dcfce7;color:#15803d}.bdg-inactive{background:#f1f5f9;color:#64748b}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:8px;font-size:.77rem;font-weight:700;border:none;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-g{background:#dcfce7;color:#15803d}.btn-g:hover{background:#16a34a;color:white}
.btn-r{background:#fee2e2;color:#dc2626}.btn-r:hover{background:#dc2626;color:white}
.btn-b{background:#dbeafe;color:#1d4ed8}.btn-b:hover{background:#2563eb;color:white}
.btn-p{background:#1B3A6B;color:white}.btn-p:hover{background:#15305a}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── TOGGLE ── */
.tog{position:relative;display:inline-block;width:38px;height:21px;cursor:pointer}
.tog input{opacity:0;width:0;height:0}
.tog-sl{position:absolute;inset:0;background:#cbd5e1;border-radius:21px;transition:.3s}
.tog-sl::before{content:'';position:absolute;height:15px;width:15px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.3s}
.tog input:checked + .tog-sl{background:#16a34a}
.tog input:checked + .tog-sl::before{transform:translateX(17px)}

/* ── MODAL ── */
#modal{display:none;position:fixed;inset:0;background:rgba(15,36,71,.55);z-index:9000;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
#modal.open{display:flex}
.modal-box{background:white;border-radius:16px;width:min(520px,95vw);max-height:85vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.25)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #e2e8f0}
.modal-hdr h3{font-size:.95rem;font-weight:800;color:#1B3A6B}
.modal-hdr button{background:none;border:none;font-size:1.1rem;color:#94a3b8;cursor:pointer}
.modal-body{padding:20px 24px}
.modal-foot{padding:0 24px 20px;display:flex;gap:10px;justify-content:flex-end}
.adm-form{display:flex;flex-direction:column;gap:13px}
.fld label{display:block;font-size:.75rem;font-weight:700;color:#64748b;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 13px;border:1px solid #e2e8f0;border-radius:8px;font-size:.87rem;color:#1e293b;outline:none;transition:border-color .2s;font-family:inherit}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#1B3A6B}
.fld textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── FILTERS ── */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filters input,.filters select{padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:.84rem;background:white;color:#1e293b;outline:none}

/* ── PROGRESS ── */
.progress-wrap{display:none;margin-top:12px}
.progress-bar{background:#e2e8f0;border-radius:999px;height:8px;overflow:hidden}
.progress-fill{height:100%;background:#1B3A6B;width:0%;transition:width .3s}
.progress-txt{font-size:.78rem;color:#64748b;text-align:center;margin-top:6px}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:12px;font-size:.87rem;font-weight:600;color:white;background:#1e293b;box-shadow:0 8px 32px rgba(0,0,0,.25);transform:translateY(80px);opacity:0;transition:all .3s;z-index:9999}
#toast.show{transform:translateY(0);opacity:1}
#toast.ok{background:#16a34a}#toast.err{background:#dc2626}#toast.warn{background:#ea580c}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">⚙ Al Handassa<span>.dz</span></div>
    <div class="login-sub">Administration</div>
    <input class="login-input" type="email"    id="email" value="admin@handassi.dz" placeholder="Email"/>
    <input class="login-input" type="password" id="pass"  placeholder="Mot de passe"/>
    <button class="login-btn" id="login-btn">
      <i class="fas fa-lock"></i> Se connecter
    </button>
    <div class="login-msg" id="login-msg"></div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <aside class="sidebar">
    <div class="sidebar-logo"><span>⚙</span>
      <div><div class="sidebar-brand">Al Handassa<span>.dz</span></div>
           <div class="sidebar-sub">Administration</div></div>
    </div>
    <div style="padding:12px 8px;flex:1">
      <button class="nav-btn active" data-page="dashboard"><i class="fas fa-chart-line"></i> Tableau de bord</button>
      <div class="nav-section">Transactions</div>
      <button class="nav-btn" data-page="payments"><i class="fas fa-credit-card"></i> Paiements <span class="nav-badge" id="badge-pay" style="display:none">0</span></button>
      <button class="nav-btn" data-page="orders"><i class="fas fa-shopping-bag"></i> Commandes</button>
      <button class="nav-btn" data-page="users"><i class="fas fa-users"></i> Utilisateurs</button>
      <div class="nav-section">Contenu</div>
      <button class="nav-btn" data-page="products"><i class="fas fa-box"></i> Produits & Ressources</button>
      <button class="nav-btn" data-page="videos"><i class="fas fa-play-circle"></i> Vidéos</button>
      <button class="nav-btn" data-page="articles"><i class="fas fa-newspaper"></i> Articles</button>
      <div class="nav-section">Catalogue</div>
      <button class="nav-btn" data-page="categories"><i class="fas fa-folder-open"></i> Catégories</button>
      <button class="nav-btn" data-page="niveaux"><i class="fas fa-graduation-cap"></i> Niveaux de formation</button>
      <div class="nav-section">Espace Entreprise</div>
      <button class="nav-btn" data-page="companies"><i class="fas fa-building"></i> Entreprises</button>
      <button class="nav-btn" data-page="jobs"><i class="fas fa-briefcase"></i> Recrutement</button>
      <button class="nav-btn" data-page="tenders"><i class="fas fa-file-contract"></i> Appels d'offres</button>
      <button class="nav-btn" data-page="professionals"><i class="fas fa-id-card"></i> Annuaire Pro</button>
    </div>
    <div class="sidebar-bottom">
      <a class="sidebar-link" href="../index.html" target="_blank"><i class="fas fa-external-link-alt"></i> Voir le site</a>
      <button class="sidebar-link" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="page-title">Tableau de bord</div>
      <div class="topbar-user" id="topbar-user"></div>
    </div>
    <div class="page" id="page"></div>
  </div>
</div>

<div id="modal"><div class="modal-box">
  <div class="modal-hdr"><h3 id="modal-title"></h3><button id="modal-close-btn">✕</button></div>
  <div class="modal-body" id="modal-body"></div>
  <div class="modal-foot" id="modal-foot"></div>
</div></div>

<div id="toast"></div>

<script src="../js/config.js"></script>
<script>
const API = HDS_SERVER + '/api';
let _user = null;

// ── HTTP ─────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const token = localStorage.getItem('hds_token');
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body)  opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || d.message || 'Erreur ' + r.status);
  return d;
}
async function apiUpload(path, formData) {
  const token = localStorage.getItem('hds_token');
  const r = await fetch(API + path, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token },
    body: formData
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || d.message || 'Erreur ' + r.status);
  return d;
}

// ── TOAST ────────────────────────────────────────────────────────────────────
let _tt;
function toast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('show'), 3500);
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function fmt(n)  { return Number(n||0).toLocaleString('fr-DZ'); }
function dt(d)   { return d ? new Date(d).toLocaleDateString('fr-DZ',{day:'2-digit',month:'short',year:'numeric'}) : '—'; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Registre d'objets pour les boutons Modifier : évite d'injecter du JSON dans les attributs onclick
let _regN = 0; const REG = {};
function reg(o) { const k = 'r' + (++_regN); REG[k] = o; return k; }
function bdg(s)  {
  const m = {pending:'En attente',paid:'Payé',completed:'Validé',failed:'Échoué',processing:'En cours',
             active:'Actif',inactive:'Inactif',admin:'Admin',student:'Étudiant',free:'Gratuit'};
  return `<span class="bdg bdg-${esc(s)}">${esc(m[s]||s)}</span>`;
}

// ── LOGIN ────────────────────────────────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('pass').value;
  const msg   = document.getElementById('login-msg');
  const btn   = document.getElementById('login-btn');
  if (!email || !pass) { msg.textContent = 'Email et mot de passe requis'; return; }
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion…';
  msg.textContent = '';
  try {
    const r = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Identifiants incorrects');
    if (d.user.role !== 'admin') throw new Error('Pas un compte administrateur');
    localStorage.setItem('hds_token',   d.access_token);
    localStorage.setItem('hds_refresh', d.refresh_token);
    localStorage.setItem('hds_user',    JSON.stringify(d.user));
    openApp(d.user);
  } catch(e) {
    msg.textContent = '❌ ' + e.message;
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-lock"></i> Se connecter';
  }
}

function openApp(user) {
  _user = user;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'flex';
  document.getElementById('topbar-user').innerHTML =
    '<strong>' + esc(user.first_name) + ' ' + esc(user.last_name) + '</strong> &nbsp;·&nbsp; ' + bdg('admin');
  loadPage('dashboard');
}

function doLogout() {
  localStorage.removeItem('hds_token');
  localStorage.removeItem('hds_refresh');
  localStorage.removeItem('hds_user');
  location.reload();
}

// ── NAVIGATION ───────────────────────────────────────────────────────────────
const titles = { dashboard:'Tableau de bord', payments:'Paiements', orders:'Commandes',
                 users:'Utilisateurs', products:'Produits & Ressources', videos:'Vidéos',
                 articles:'Articles', categories:'Catégories', niveaux:'Niveaux de formation',
                 companies:'Entreprises', jobs:'Recrutement', tenders:"Appels d'offres", professionals:'Annuaire Pro' };
async function loadPage(name) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.nav-btn[data-page="'+name+'"]')?.classList.add('active');
  document.getElementById('page-title').textContent = titles[name] || name;
  document.getElementById('page').innerHTML = '<div style="text-align:center;padding:60px;color:#94a3b8"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';
  const fns = { dashboard:pgDashboard, payments:pgPayments, orders:pgOrders,
                users:pgUsers, products:pgProducts, videos:pgVideos, articles:pgArticles,
                categories:pgCategories, niveaux:pgNiveaux, companies:pgCompanies, jobs:pgJobs, tenders:pgTenders, professionals:pgProfessionals };
  try { await (fns[name] || (() => {}))(); } catch(e) { toast(e.message,'err'); }
}

// ── DASHBOARD ────────────────────────────────────────────────────────────────
async function pgDashboard() {
  const s = await api('GET', '/admin/stats');
  const nb = s.pending_payments || 0;
  const badge = document.getElementById('badge-pay');
  badge.textContent = nb; badge.style.display = nb ? '' : 'none';
  document.getElementById('page').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-val">${fmt(s.total_users)}</div><div class="kpi-lbl">👥 Utilisateurs</div></div>
      <div class="kpi g"><div class="kpi-val">${fmt(s.total_revenue)}</div><div class="kpi-lbl">💰 Revenus DZD</div></div>
      <div class="kpi o"><div class="kpi-val">${fmt(s.pending_payments)}</div><div class="kpi-lbl">⏳ Paiements en attente</div></div>
      <div class="kpi"><div class="kpi-val">${fmt(s.total_products)}</div><div class="kpi-lbl">📦 Produits actifs</div></div>
      <div class="kpi"><div class="kpi-val">${fmt(s.total_videos)}</div><div class="kpi-lbl">🎬 Vidéos</div></div>
      <div class="kpi"><div class="kpi-val">${fmt(s.total_orders)}</div><div class="kpi-lbl">🛒 Commandes</div></div>
      <div class="kpi g"><div class="kpi-val">${fmt(s.new_users_today)}</div><div class="kpi-lbl">🆕 Nouveaux aujourd'hui</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="card">
        <div class="card-hdr"><h3>🛒 Commandes récentes</h3><button class="btn btn-b" data-action="load-page" data-page="payments">Voir paiements</button></div>
        <table><thead><tr><th>Client</th><th>Montant</th><th>Statut</th><th>Date</th></tr></thead>
        <tbody>${(s.recent_orders||[]).map(o=>`<tr>
          <td><strong>${esc(o.first_name)} ${esc(o.last_name)}</strong><br><small style="color:#94a3b8">${esc(o.email)}</small></td>
          <td><strong>${fmt(o.total_amount)} DZD</strong></td>
          <td>${bdg(o.status)}</td><td>${dt(o.created_at)}</td>
        </tr>`).join('') || '<tr><td colspan="4" class="no-data">Aucune commande</td></tr>'}</tbody></table>
      </div>
      <div class="card">
        <div class="card-hdr"><h3>👥 Nouveaux utilisateurs</h3></div>
        <table><thead><tr><th>Nom</th><th>Rôle</th><th>Date</th></tr></thead>
        <tbody>${(s.recent_users||[]).map(u=>`<tr>
          <td><strong>${esc(u.first_name)} ${esc(u.last_name)}</strong><br><small style="color:#94a3b8">${esc(u.email)}</small></td>
          <td>${bdg(u.role)}</td><td>${dt(u.created_at)}</td>
        </tr>`).join('') || '<tr><td colspan="3" class="no-data">Aucun utilisateur</td></tr>'}</tbody></table>
      </div>
    </div>`;
}

// ── PAIEMENTS ────────────────────────────────────────────────────────────────
async function pgPayments() {
  const r = await api('GET', '/admin/payments?status=pending&limit=50');
  const pays = r.data || [];
  document.getElementById('page').innerHTML = `
    <div class="card">
      <div class="card-hdr"><h3>⏳ Paiements en attente (${pays.length})</h3></div>
      <table><thead><tr><th>Client</th><th>Méthode</th><th>Montant</th><th>Référence</th><th>Date</th><th>Actions</th></tr></thead>
      <tbody id="pay-body">${pays.map(p=>`<tr id="pr-${esc(p.id)}">
        <td><strong>${esc(p.first_name)} ${esc(p.last_name)}</strong><br><small style="color:#94a3b8">${esc(p.email)}</small><br>
            <small style="color:#94a3b8">Cmd: ${esc(p.order_number||'—')}</small></td>
        <td><strong>${esc((p.method||'').toUpperCase())}</strong></td>
        <td><strong style="color:#1B3A6B">${fmt(p.amount)} DZD</strong></td>
        <td><code style="font-size:.75rem;background:#f0f4fa;padding:2px 8px;border-radius:6px">${esc(p.reference||p.baridimob_ref||'—')}</code>

async function doUpload() {
  const title = document.getElementById('up-t').value.trim();
  const type  = document.getElementById('up-type').value;
  const lv    = document.getElementById('up-lv').value;
  const cat   = document.getElementById('up-cat').value;
  const tagsRaw = document.getElementById('up-tags').value.trim();
  const desc  = document.getElementById('up-desc').value.trim();
  const price = parseFloat(document.getElementById('up-price').value)||0;
  const free  = document.getElementById('up-free').value === 'true';
  const file  = document.getElementById('up-file').files[0];
  if (!title) { toast('Titre requis','err'); return; }
  if (!type)  { toast('Type requis','err'); return; }
  if (!file)  { toast('Fichier requis','err'); return; }
  const btn = document.getElementById('up-btn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi…';
  document.getElementById('up-prog').style.display = 'block';
  const bar = document.getElementById('up-bar');
  const txt = document.getElementById('up-txt');
  let p = 0;
  const iv = setInterval(() => { p = Math.min(p+3,88); bar.style.width=p+'%'; txt.textContent='Envoi '+p+'%…'; }, 500);
  const fd = new FormData();
  fd.append('title', title); fd.append('type', type); fd.append('study_level', lv);
  fd.append('description', desc||title); fd.append('price', price); fd.append('is_free', free);
  fd.append('language','fr');
  if (cat) fd.append('category_id', cat);
  const tags = tagsRaw ? tagsRaw.split(',').map(t=>t.trim()).filter(Boolean) : [];
  if (tags.length) fd.append('tags', JSON.stringify(tags));
  fd.append('file', file);
  try {
    await apiUpload('/products', fd);
    clearInterval(iv); bar.style.width='100%'; txt.textContent='✅ Envoyé !';
    toast('✅ Ressource ajoutée !','ok');
    setTimeout(() => { closeModal(); pgProducts(); }, 900);
  } catch(e) {
    clearInterval(iv); bar.style.width='0';
    document.getElementById('up-prog').style.display='none';
    btn.disabled=false; btn.innerHTML='<i class="fas fa-upload"></i> Envoyer';
    toast('Erreur : '+e.message,'err');
  }
}

    .forEach(cb => fd.append('specialties', cb.value));

  const cover = document.getElementById('cf-cover').files[0];

    const url   = id ? `/api/companies/admin/${id}` : '/api/companies/admin';

    if (!data.success) throw new Error(data.message);
    toast(id?'✅ Entreprise modifiée':'✅ Entreprise créée','ok');
    closeModal(); pgCompanies();

async function savePro(id) {
  const first_name = document.getElementById('pf-fn').value.trim();
  const last_name  = document.getElementById('pf-ln').value.trim();
  if (!first_name || !last_name) { toast('Prénom et nom requis','err'); return; }

  const fd = new FormData();
  fd.append('first_name',   first_name);
  fd.append('last_name',    last_name);
  fd.append('title',        document.getElementById('pf-title').value.trim());
  fd.append('tagline',      document.getElementById('pf-tagline').value.trim());
  fd.append('bio',          document.getElementById('pf-bio').value.trim());
  fd.append('wilaya',       document.getElementById('pf-wilaya').value);
  fd.append('city',         document.getElementById('pf-city').value.trim());
  fd.append('experience_years', document.getElementById('pf-exp').value);
  fd.append('availability', document.getElementById('pf-avail').value);
  fd.append('education',    document.getElementById('pf-edu').value.trim());
  fd.append('institution',  document.getElementById('pf-inst').value.trim());
  fd.append('contract_pref',document.getElementById('pf-contract').value.trim());
  fd.append('email',        document.getElementById('pf-email').value.trim());
  fd.append('phone',        document.getElementById('pf-phone').value.trim());
  fd.append('linkedin_url', document.getElementById('pf-linkedin').value.trim());
  fd.append('portfolio_url',document.getElementById('pf-portfolio').value.trim());
  fd.append('is_verified',  document.getElementById('pf-verified').checked);
  fd.append('is_premium',   document.getElementById('pf-premium').checked);
  fd.append('is_active',    document.getElementById('pf-active').checked);

  // Compétences (split par virgule)
  document.getElementById('pf-skills').value.split(',')
    .map(s=>s.trim()).filter(Boolean)
    .forEach(s => fd.append('skills', s));

  // Spécialités (checkboxes)
  document.querySelectorAll('input[name="pspec"]:checked')
    .forEach(cb => fd.append('specialties', cb.value));

  // Langues (checkboxes)
  document.querySelectorAll('input[name="plang"]:checked')
    .forEach(cb => fd.append('languages', cb.value));

  const photo = document.getElementById('pf-photo').files[0];
  if (photo) fd.append('photo', photo);

  try {
    const token = localStorage.getItem('admin_token');
    const url   = id ? `/api/professionals/admin/${id}` : '/api/professionals/admin';
    const method= id ? 'PATCH' : 'POST';
    const resp  = await fetch(url, { method, headers:{'Authorization':'Bearer '+token}, body:fd });
    const data  = await resp.json();
    if (!data.success) throw new Error(data.message);
    toast(id?'✅ Profil modifié':'✅ Profil créé','ok');
    closeModal(); pgProfessionals();
  } catch(e) { toast(e.message,'err'); }
}

async function deletePro(id, name) {
  if (!confirm(`Désactiver "${name}" ?`)) return;
  try {
    await api('DELETE', '/professionals/admin/'+id);
    toast('Profil désactivé','ok');
    pgProfessionals();
  } catch(e) { toast(e.message,'err'); }
}

// ── MODAL ────────────────────────────────────────────────────────────────────
function openModal(title, body, foot='') {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-foot').innerHTML = foot +
    '<button class="btn" style="background:#f1f5f9;color:#475569" data-action="close-modal">Fermer</button>';
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

// ── FILTER TABLE ─────────────────────────────────────────────────────────────
function filterTable(tbId, selId, attr, searchVal) {
  const selVal = selId ? document.getElementById(selId)?.value : null;
  document.querySelectorAll('#'+tbId+' tr').forEach(tr => {
    const matchSel = !selVal || tr.getAttribute(attr)===selVal;
    const matchSrch = !searchVal || (tr.dataset.search||'').includes(searchVal.toLowerCase());
    tr.style.display = matchSel && matchSrch ? '' : 'none';
  });
}

// ── ÉVÉNEMENTS (socle statique) ────────────────────────────────────────────────
// Le contenu de #page et de #modal-foot/#modal-body est reconstruit en permanence (innerHTML) par les
// fonctions pgXxx()/showXxxForm() ci-dessus : un addEventListener posé sur un bouton précis serait perdu au
// re-rendu suivant. On délègue donc sur les conteneurs stables (#page, #modal), posés une seule fois ici.
document.getElementById('pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
document.getElementById('login-btn').addEventListener('click', doLogin);
document.querySelectorAll('.nav-btn[data-page]').forEach((btn) => {
  btn.addEventListener('click', () => loadPage(btn.dataset.page));
});
document.getElementById('logout-btn').addEventListener('click', doLogout);
document.getElementById('modal-close-btn').addEventListener('click', closeModal);

// Actions déclenchées par un clic dans #page (tables, boutons d'ajout/édition/suppression, raccourcis) —
// data-reg pointe vers un objet complet stocké dans REG (voir reg()), utilisé pour préremplir un formulaire.
document.getElementById('page').addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset;
  switch (a.action) {
    case 'load-page':         loadPage(a.page); break;
    case 'validate-pay':      validatePay(a.id, a.order); break;
    case 'reject-pay':        rejectPay(a.id); break;
    case 'show-upload':       showUpload(); break;
    case 'edit-prod':         showEditProd(REG[a.reg]); break;
    case 'del-prod':          delProd(a.id, a.n); break;
    case 'show-video-form':   showVideoForm(a.reg ? REG[a.reg] : undefined); break;
    case 'del-vid':           delVid(a.id, a.n); break;
    case 'show-art-form':     showArtForm(a.reg ? REG[a.reg] : undefined); break;
    case 'del-art':           delArt(a.id, a.n); break;
    case 'show-cat-form':     showCatForm(a.reg ? REG[a.reg] : undefined); break;
    case 'show-lvl-form':     showLvlForm(a.reg ? REG[a.reg] : undefined); break;
    case 'show-company-form': showCompanyForm(a.reg ? REG[a.reg] : undefined); break;
    case 'delete-company':    deleteCompany(a.id, a.n); break;
    case 'show-job-form':     showJobForm(a.reg ? REG[a.reg] : undefined); break;
    case 'delete-job':        deleteJob(a.id, a.n); break;
    case 'show-tender-form':  showTenderForm(a.reg ? REG[a.reg] : undefined); break;
    case 'delete-tender':     deleteTender(a.id, a.n); break;
    case 'show-pro-form':     showProForm(a.reg ? REG[a.reg] : undefined); break;
    case 'delete-pro':        deletePro(a.id, a.n); break;
  }
});

// Cases à cocher (bascules actif/publié) et listes déroulantes de filtre dans #page
document.getElementById('page').addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.toggle === 'prod') return toggleProd(el.dataset.id);
  if (el.dataset.toggle === 'vid')  return toggleVid(el.dataset.id);
  if (el.dataset.toggle === 'art')  return toggleArt(el.dataset.id);
  if (el.dataset.toggle === 'cat')  return toggleCat(el.dataset.id, el.checked);
  if (el.dataset.toggle === 'lvl')  return toggleLvl(el.dataset.id, REG[el.dataset.reg].label_fr, el.checked);
  if (el.dataset.filterTable) return filterTable(el.dataset.filterTable, el.id, el.dataset.filterAttr);
});

// Recherche en direct (barres de filtre texte) dans #page
document.getElementById('page').addEventListener('input', (e) => {
  if (e.target.dataset.filterTable) filterTable(e.target.dataset.filterTable, null, null, e.target.value);
});

// Boutons du pied de modale (Enregistrer/Envoyer/Fermer/Annuler) : le contenu de #modal-foot change à
// chaque appel de openModal() — délégation ici aussi, pour la même raison que sur #page.
document.getElementById('modal-foot').addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset;
  switch (a.action) {
    case 'close-modal':  closeModal(); break;
    case 'do-upload':    doUpload(); break;
    case 'save-prod':    saveEditProd(a.id); break;
    case 'save-vid':     saveVid(a.id); break;
    case 'save-art':     saveArt(a.id); break;
    case 'save-cat':     saveCat(a.id); break;
    case 'save-lvl':     saveLvl(a.id); break;
    case 'save-company': saveCompany(a.id); break;
    case 'save-job':     saveJob(a.id); break;
    case 'save-tender':  saveTender(a.id); break;
    case 'save-pro':     savePro(a.id); break;
  }
});

// ── INIT ─────────────────────────────────────────────────────────────────────
(async () => {
  const token = localStorage.getItem('hds_token');
  if (token) {
    try {
      const r = await fetch(API+'/auth/me',{headers:{'Authorization':'Bearer '+token}});
      const d = await r.json();
      if (d.user?.role==='admin') { openApp(d.user); return; }
    } catch(e) {}
  }
})();
</script>
