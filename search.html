<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Résultats de recherche — Al Handassa.dz</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/img/favicon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.min.css" />
  <style>
    .search-container { max-width: 1200px; margin: 40px auto; padding: 20px; }
    .search-header { margin-bottom: 40px; }
    .search-input-wrap { display: flex; gap: 12px; margin-bottom: 20px; }
    .search-input { flex: 1; padding: 12px 16px; border: 2px solid #d1d5db; border-radius: 8px; font-size: 16px; font-family: Cairo, sans-serif; }
    .search-input:focus { outline: none; border-color: #1B3A6B; }
    .search-btn { padding: 12px 24px; background: #1B3A6B; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: Cairo, sans-serif; }
    .search-btn:hover { background: #2563a8; }
    .search-results-header { font-size: 18px; font-weight: 700; color: #1B3A6B; margin-bottom: 20px; }
    .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .result-card { border: 1px solid #e0e4e8; border-radius: 8px; overflow: hidden; transition: box-shadow .2s; cursor: pointer; }
    .result-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.1); }
    .result-card-thumb { width: 100%; height: 200px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 48px; position: relative; overflow: hidden; }
    .result-card-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .result-card-body { padding: 12px; }
    .result-title { font-weight: 600; color: #1B3A6B; font-size: 14px; margin-bottom: 8px; line-height: 1.3; }
    .result-meta { font-size: 12px; color: #888; margin-bottom: 8px; }
    .result-price { font-weight: 700; color: #D4A017; }
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-icon { font-size: 64px; margin-bottom: 16px; }
    .empty-title { font-size: 20px; color: #1B3A6B; margin-bottom: 8px; }
    .back-link { display: inline-block; margin-bottom: 20px; padding: 8px 16px; background: #f0f0f0; color: #1B3A6B; text-decoration: none; border-radius: 6px; font-weight: 600; }
  </style>
</head>
<body style="background: #f5f6f8;">

<nav style="background: white; box-shadow: 0 1px 3px rgba(0,0,0,.1); padding: 16px 0; position: sticky; top: 0; z-index: 100;">
  <div style="max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between;">
    <a href="index.html" style="font-weight: 700; color: #1B3A6B; text-decoration: none; font-size: 16px;">← Retour à l'accueil</a>
    <div style="display: flex; gap: 12px;">
      <span id="cart-btn" style="padding: 8px 16px; background: #f0f0f0; border-radius: 6px; cursor: pointer; font-weight: 600;">🛒</span>
    </div>
  </div>
</nav>

<div class="search-container">
  <a href="index.html" class="back-link">← Retour au catalogue</a>

  <div class="search-header">
    <h1 style="color: #1B3A6B; font-size: 28px; margin-bottom: 20px;">🔍 Rechercher dans le catalogue</h1>

    <div class="search-input-wrap">
      <input type="text" id="search-input" class="search-input" placeholder="Recherchez par titre, catégorie, tags..." />
      <button class="search-btn" onclick="performSearch()">Chercher</button>
    </div>
  </div>

  <div id="search-content">
    <div class="empty-state">
      <div class="empty-icon">🔍</div>
      <h2 class="empty-title">Entrez votre recherche</h2>
      <p style="color: #888;">Tapez au moins 2 caractères pour lancer la recherche.</p>
    </div>
  </div>
</div>

<script src="js/cart.js"></script>
<script>
const API = 'http://localhost:5000/api';

function getQueryParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name) || '';
}

async function performSearch(query) {
  const q = query || document.getElementById('search-input').value.trim();

  if (!q || q.length < 2) {
    document.getElementById('search-content').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <h2 class="empty-title">Terme trop court</h2>
        <p style="color: #888;">Tapez au moins 2 caractères.</p>
      </div>
    `;
    return;
  }

  // Mettre à jour l'URL
  window.history.replaceState({}, '', `?q=${encodeURIComponent(q)}`);
  document.getElementById('search-input').value = q;

  const content = document.getElementById('search-content');
  content.innerHTML = '<div style="text-align: center; padding: 40px;"><span style="font-size: 24px;">⏳ Recherche en cours...</span></div>';

  try {
    const res = await fetch(`${API}/products/search/query?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    const results = data.data || [];

    if (results.length === 0) {
      content.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">😕</div>
          <h2 class="empty-title">Aucun résultat</h2>
          <p style="color: #888;">Essayez avec d'autres mots-clés.</p>
        </div>
      `;
      return;
    }

    let html = '<div class="results-grid">';
    results.forEach(p => {
      const icon = '📄';
      const hasThumb = p.thumbnail_url;
      const thumbImg = hasThumb
        ? `<img src="http://localhost:5000${p.thumbnail_url}" alt="${p.title}" onerror="this.style.display='none'">`
        : `<span>${icon}</span>`;

      html += `
        <div class="result-card" onclick="location.href='product.html?slug=${p.slug}'">
          <div class="result-card-thumb">${thumbImg}</div>
          <div class="result-card-body">
            <div class="result-title">${p.title}</div>
            <div class="result-meta">${p.type} • ${p.category_name || 'Génie Civil'}</div>
            <div class="result-price">${p.is_free ? 'Gratuit' : (p.price || 0).toLocaleString('fr-DZ') + ' DA'}</div>
          </div>
        </div>
      `;
    });
    html += '</div>';
    content.innerHTML = html;

    // Attacher les événements panier
    document.querySelectorAll('.result-card').forEach(card => {
      const title = card.querySelector('.result-title').textContent;
      card.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        // Clic droit pour ajouter au panier (optionnel)
      });
    });

  } catch (err) {
    content.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">❌</div>
        <h2 class="empty-title">Erreur</h2>
        <p style="color: #888;">${err.message}</p>
      </div>
    `;
  }
}

// Charger la recherche depuis l'URL au chargement
window.addEventListener('DOMContentLoaded', () => {
  const q = getQueryParam('q');
  if (q) {
    performSearch(q);
  }

  // Panier
  const cartBtn = document.getElementById('cart-btn');
  if (cartBtn) {
    cartBtn.addEventListener('click', () => location.href = 'cart.html');
  }
});

// Recherche au appui sur Entrée
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('search-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') performSearch();
  });
});
</script>
</body>
</html>
